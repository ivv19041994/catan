name: Dedicated server

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version contract
        run: scripts/validate_release_version.sh
      - name: Configure
        run: cmake -S . -B build-ci -DCATAN_BUILD_CONSOLE=OFF -DCATAN_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-ci --parallel
      - name: Unit and domain tests
        run: ctest --test-dir build-ci --output-on-failure
      - name: Dedicated TCP smoke
        timeout-minutes: 3
        run: scripts/run_dedicated_server_smoke.sh build-ci
